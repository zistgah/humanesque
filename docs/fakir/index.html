<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAKIR — ISIC · ISCO · ISCED</title>
  <link rel="stylesheet" href="../site.css" />
</head>
<body class="site">
<header class="site-head">
  <strong>FAKIR</strong>
  <nav>
    <a href="../index.html">PANINI</a>
    <a href="../mez/">mez</a>
    <a href="https://zistgah.org/fakir/">dome (live)</a>
  </nav>
</header>
<main class="site-main">
  <h1>UKOP kernel — domain lattice</h1>
  <p class="lead">UN ISIC · ILO ISCO · UNESCO ISCED, crossed with the ten-layer AGI stack (L0–L9) from ilm.codes/explore. Retrieved <code>domains.json</code> from <code>zistgah/fakir</code>. The 9,350-point dome stays at fakir; this page is the readable taxonomy.</p>
  <p id="meta"></p>
  <div id="layers"></div>
  <div id="fams"></div>
</main>
<script>
fetch("domains.json").then(r => r.json()).then(d => {
  document.getElementById("meta").textContent =
    d.meta.name + " · " + d.domains.length + " top-level domains · " +
    d.layers.length + " AGI layers · DOI software 10.5281/zenodo.21436550";
  document.getElementById("layers").innerHTML =
    "<h2>AGI stack</h2><ol>" +
    d.layers.map(l => "<li><code>" + l.id + "</code> " + l.name + "</li>").join("") +
    "</ol>";
  const by = {};
  d.domains.forEach(x => { (by[x.family] = by[x.family] || []).push(x); });
  document.getElementById("fams").innerHTML = d.families.map(f =>
    "<h2>" + f.label + " (" + (by[f.id]||[]).length + ")</h2><ul>" +
    (by[f.id]||[]).map(x => "<li><code>" + x.code + "</code> " + x.name + "</li>").join("") +
    "</ul>"
  ).join("");
});
</script>
</body>
</html>
