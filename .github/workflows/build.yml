name: panini-bootstrap
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/run.mjs
      - run: node scripts/bootstrap.mjs
      - run: node scripts/selfhost.mjs
